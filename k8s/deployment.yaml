apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      containers:
        - name: monitor
          image: swapnilyavalkar/system-resource-monitoring-web-app:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: monitor